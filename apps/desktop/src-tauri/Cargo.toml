[package]
name = "eee-workbench-desktop"
version = "0.1.0"
description = "EEE Workbench desktop application"
authors = ["EEE Workbench contributors"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eee-numerical = { path = "../../../crates/numerical" }
eee-project = { path = "../../../crates/project" }
eee-resource-manager = { path = "../../../crates/resource-manager" }
eee-circuit-studio = { path = "../../../studios/circuit" }
